name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bonusplay_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Throwaway CI database only. Tests create and drop isolated schemas.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bonusplay_ci
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Access and MFA policy tests
        run: pnpm --filter @workspace/api-server run test:v2
      - name: Points ledger tests
        run: pnpm --filter @workspace/api-server run test:v2-points
      - name: Offer tests
        run: pnpm --filter @workspace/api-server run test:v2-offers
      - name: Reward tests
        run: pnpm --filter @workspace/api-server run test:v2-rewards
      - name: Admin approval queue tests
        run: pnpm --filter @workspace/api-server run test:v2-admin
      - name: Economy, funding and XP tests
        run: pnpm --filter @workspace/api-server run test:v2-economy
      - name: Gift card fulfillment tests
        run: pnpm --filter @workspace/api-server run test:v2-fulfillment
      - name: Frontend cache tests
        run: pnpm --filter @workspace/bonusplay run test:v2-cache
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level critical
