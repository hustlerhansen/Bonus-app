openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for the BONUSPLAY demo rewards platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bonusplay
    description: BONUSPLAY demo account, game and rewards operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bonusplay/demo-session:
    post:
      operationId: startDemoSession
      tags: [bonusplay]
      summary: Start a signed demo user or admin session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoSessionInput"
      responses:
        "200":
          description: Demo session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoSession"
        "400":
          description: Invalid demo role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/logout:
    post:
      operationId: endDemoSession
      tags: [bonusplay]
      summary: End the current demo session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /bonusplay/state:
    get:
      operationId: getBonusplayState
      tags: [bonusplay]
      summary: Get the current user's full app state
      responses:
        "200":
          description: Current app state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonusplayState"
        "401":
          description: Demo session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/claims:
    post:
      operationId: claimActivity
      tags: [bonusplay]
      summary: Claim a server-approved demo activity reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimActivityInput"
      responses:
        "200":
          description: Activity reward accepted or already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResult"
        "400":
          description: Invalid activity or session identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Demo session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Activity already claimed or daily limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/daily-reward:
    post:
      operationId: claimDailyReward
      tags: [bonusplay]
      summary: Claim today's streak reward
      responses:
        "200":
          description: Daily reward claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResult"
        "401":
          description: Demo session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Today's reward was already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/redemptions:
    post:
      operationId: createRedemption
      tags: [bonusplay]
      summary: Order a demo reward using points
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedemptionInput"
      responses:
        "201":
          description: Demo reward order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResult"
        "400":
          description: Invalid reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Demo session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Insufficient balance or duplicate request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/reset:
    post:
      operationId: resetDemo
      tags: [bonusplay]
      summary: Restore the original demo account state
      responses:
        "200":
          description: Demo account restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonusplayState"
        "401":
          description: Demo session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/features/{key}:
    patch:
      operationId: updateFeatureFlag
      tags: [bonusplay]
      summary: Enable or disable a demo feature (admin only)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum: [ADS, SURVEYS, OFFERS, GAMES, EVENTS, LEADERBOARDS, REFERRALS, REDEMPTIONS, CHESTS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureFlagInput"
      responses:
        "200":
          description: Feature flag updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlag"
        "401":
          description: Demo admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/missions/{id}:
    patch:
      operationId: updateMission
      tags: [bonusplay]
      summary: Edit a demo mission (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionUpdate"
      responses:
        "200":
          description: Mission updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          description: Demo admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Mission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/admin:
    get:
      operationId: getAdminDashboard
      tags: [bonusplay]
      summary: Get demo admin metrics (admin only)
      responses:
        "200":
          description: Admin dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          description: Demo admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/admin/catalog:
    get:
      operationId: getAdminCatalog
      tags: [bonusplay]
      summary: List all editable demo catalog items
      responses:
        "200":
          description: Catalog items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogItem"
        "401":
          description: Admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCatalogItem
      tags: [bonusplay]
      summary: Create a mission, survey, offer, event or reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogInput"
      responses:
        "201":
          description: Catalog item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItem"
        "400":
          description: Invalid catalog item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/admin/catalog/{id}:
    patch:
      operationId: updateCatalogItem
      tags: [bonusplay]
      summary: Edit or disable a demo catalog item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogUpdate"
      responses:
        "200":
          description: Catalog item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItem"
        "400":
          description: Invalid catalog item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Catalog item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [bonusplay]
      summary: Persist notification read status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationReadInput"
      responses:
        "200":
          description: Notifications updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonusplayState"
  /bonusplay/analytics:
    post:
      operationId: recordAnalyticsEvent
      tags: [bonusplay]
      summary: Record a permitted demo analytics event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsInput"
      responses:
        "200":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]
    DemoSessionInput:
      type: object
      properties:
        role:
          type: string
          enum: [user, admin]
      required: [role]
    DemoSession:
      type: object
      properties:
        role:
          type: string
          enum: [user, admin]
        displayName:
          type: string
      required: [role, displayName]
    UserProfile:
      type: object
      properties:
        id:
          type: string
        displayName:
          type: string
        role:
          type: string
          enum: [user, admin]
        points:
          type: integer
        gems:
          type: integer
        xp:
          type: integer
        level:
          type: integer
        xpTarget:
          type: integer
        streak:
          type: integer
        achievementsUnlocked:
          type: integer
        totalPointsEarned:
          type: integer
        gamesPlayed:
          type: integer
        surveysCompleted:
          type: integer
        activeReferrals:
          type: integer
      required: [id, displayName, role, points, gems, xp, level, xpTarget, streak, achievementsUnlocked, totalPointsEarned, gamesPlayed, surveysCompleted, activeReferrals]
    Mission:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        type:
          type: string
          enum: [WATCH_AD, PLAY_GAME, SURVEY, OFFER, DAILY_CHALLENGE, REFERRAL, STREAK]
        points:
          type: integer
        xp:
          type: integer
        enabled:
          type: boolean
        completed:
          type: boolean
      required: [id, title, description, type, points, xp, enabled, completed]
    Survey:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        minutes:
          type: integer
        points:
          type: integer
        xp:
          type: integer
        completed:
          type: boolean
      required: [id, title, minutes, points, xp, completed]
    Offer:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        points:
          type: integer
        xp:
          type: integer
        completed:
          type: boolean
      required: [id, title, description, points, xp, completed]
    WalletTransaction:
      type: object
      properties:
        id:
          type: string
        amount:
          type: integer
        currency:
          type: string
          enum: [points, gems]
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, amount, currency, title, createdAt]
    Reward:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        subtitle:
          type: string
        cost:
          type: integer
        nokAmount:
          type: integer
        category:
          type: string
        available:
          type: boolean
      required: [id, title, subtitle, cost, nokAmount, category, available]
    Redemption:
      type: object
      properties:
        id:
          type: string
        rewardTitle:
          type: string
        nokAmount:
          type: integer
        points:
          type: integer
        status:
          type: string
          enum: [PENDING, MANUAL_REVIEW]
        createdAt:
          type: string
          format: date-time
      required: [id, rewardTitle, nokAmount, points, status, createdAt]
    LeaderboardEntry:
      type: object
      properties:
        rank:
          type: integer
        name:
          type: string
        points:
          type: integer
        isCurrentUser:
          type: boolean
      required: [rank, name, points, isCurrentUser]
    Achievement:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        progress:
          type: integer
        target:
          type: integer
        unlocked:
          type: boolean
      required: [id, title, description, progress, target, unlocked]
    Notification:
      type: object
      properties:
        id:
          type: string
        message:
          type: string
        read:
          type: boolean
      required: [id, message, read]
    EventProgress:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        gems:
          type: integer
        target:
          type: integer
        secondsRemaining:
          type: integer
      required: [id, title, gems, target, secondsRemaining]
    FeatureFlag:
      type: object
      properties:
        key:
          type: string
        enabled:
          type: boolean
      required: [key, enabled]
    BonusplayState:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserProfile"
        missions:
          type: array
          items:
            $ref: "#/components/schemas/Mission"
        surveys:
          type: array
          items:
            $ref: "#/components/schemas/Survey"
        offers:
          type: array
          items:
            $ref: "#/components/schemas/Offer"
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/WalletTransaction"
        rewards:
          type: array
          items:
            $ref: "#/components/schemas/Reward"
        redemptions:
          type: array
          items:
            $ref: "#/components/schemas/Redemption"
        leaderboard:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        achievements:
          type: array
          items:
            $ref: "#/components/schemas/Achievement"
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        event:
          $ref: "#/components/schemas/EventProgress"
        events:
          type: array
          items:
            $ref: "#/components/schemas/EventProgress"
        leaderboards:
          $ref: "#/components/schemas/LeaderboardPeriods"
        featureFlags:
          type: array
          items:
            $ref: "#/components/schemas/FeatureFlag"
        lastDailyClaim:
          type: ["string", "null"]
      required: [user, missions, surveys, offers, transactions, rewards, redemptions, leaderboard, leaderboards, achievements, notifications, event, events, featureFlags, lastDailyClaim]
    ClaimActivityInput:
      type: object
      properties:
        activityId:
          type: string
          minLength: 1
          maxLength: 80
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 100
      required: [activityId, idempotencyKey]
    ClaimResult:
      type: object
      properties:
        state:
          $ref: "#/components/schemas/BonusplayState"
        pointsEarned:
          type: integer
        xpEarned:
          type: integer
        gemsEarned:
          type: integer
        message:
          type: string
      required: [state, pointsEarned, xpEarned, gemsEarned, message]
    RedemptionInput:
      type: object
      properties:
        rewardId:
          type: string
        idempotencyKey:
          type: string
          minLength: 8
          maxLength: 100
      required: [rewardId, idempotencyKey]
    FeatureFlagInput:
      type: object
      properties:
        enabled:
          type: boolean
      required: [enabled]
    MissionUpdate:
      type: object
      properties:
        enabled:
          type: boolean
        points:
          type: integer
          minimum: 0
          maximum: 10000
        xp:
          type: integer
          minimum: 0
          maximum: 10000
    AdminMetric:
      type: object
      properties:
        label:
          type: string
        value:
          type: string
      required: [label, value]
    AdminDashboard:
      type: object
      properties:
        metrics:
          type: array
          items:
            $ref: "#/components/schemas/AdminMetric"
        featureFlags:
          type: array
          items:
            $ref: "#/components/schemas/FeatureFlag"
        missions:
          type: array
          items:
            $ref: "#/components/schemas/Mission"
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        redemptions:
          type: array
          items:
            $ref: "#/components/schemas/Redemption"
        fraudEvents:
          type: array
          items:
            $ref: "#/components/schemas/FraudEvent"
        auditLogs:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"
        revenueEvents:
          type: array
          items:
            $ref: "#/components/schemas/RevenueEvent"
      required: [metrics, featureFlags, missions, users, redemptions, fraudEvents, auditLogs, revenueEvents]
    LeaderboardPeriods:
      type: object
      properties:
        day:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        week:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
        month:
          type: array
          items:
            $ref: "#/components/schemas/LeaderboardEntry"
      required: [day, week, month]
    CatalogItem:
      type: object
      properties:
        id: { type: string }
        category: { type: string, enum: [mission, survey, offer, event, reward] }
        title: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        type: { type: string }
        points: { type: integer }
        xp: { type: integer }
        gems: { type: integer }
        minutes: { type: integer }
        cost: { type: integer }
        nokAmount: { type: integer }
        rewardCategory: { type: string }
        target: { type: integer }
        endsAt: { type: string, format: date-time }
      required: [id, category, title, description, enabled]
    CatalogInput:
      type: object
      properties:
        category: { type: string, enum: [mission, survey, offer, event, reward] }
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        enabled: { type: boolean }
        type: { type: string, enum: [WATCH_AD, PLAY_GAME, SURVEY, OFFER, DAILY_CHALLENGE, REFERRAL, STREAK] }
        points: { type: integer, minimum: 0, maximum: 10000 }
        xp: { type: integer, minimum: 0, maximum: 1000 }
        gems: { type: integer, minimum: 0, maximum: 100 }
        minutes: { type: integer, minimum: 0, maximum: 60 }
        cost: { type: integer, minimum: 1, maximum: 1000000 }
        nokAmount: { type: integer, minimum: 1, maximum: 10000 }
        rewardCategory: { type: string, maxLength: 50 }
        target: { type: integer, minimum: 1, maximum: 10000 }
        endsAt: { type: string, format: date-time }
      required: [category, title]
    CatalogUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        enabled: { type: boolean }
        type: { type: string, enum: [WATCH_AD, PLAY_GAME, SURVEY, OFFER, DAILY_CHALLENGE, REFERRAL, STREAK] }
        points: { type: integer, minimum: 0, maximum: 10000 }
        xp: { type: integer, minimum: 0, maximum: 1000 }
        gems: { type: integer, minimum: 0, maximum: 100 }
        minutes: { type: integer, minimum: 0, maximum: 60 }
        cost: { type: integer, minimum: 1, maximum: 1000000 }
        nokAmount: { type: integer, minimum: 1, maximum: 10000 }
        rewardCategory: { type: string, maxLength: 50 }
        target: { type: integer, minimum: 1, maximum: 10000 }
        endsAt: { type: string, format: date-time }
    NotificationReadInput:
      type: object
      properties:
        notificationIds:
          type: array
          maxItems: 10
          items: { type: string, enum: [streak, reward, event, rank, balance] }
      required: [notificationIds]
    AnalyticsInput:
      type: object
      properties:
        event:
          type: string
          enum: [mission_started, ad_started, game_started, survey_started, offer_started, reward_viewed, redemption_started, referral_shared]
        sourceId: { type: string, maxLength: 80 }
      required: [event]
    AdminUser:
      type: object
      properties:
        id: { type: string }
        displayName: { type: string }
        level: { type: integer }
        totalPointsEarned: { type: integer }
        activeReferrals: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, displayName, level, totalPointsEarned, activeReferrals, createdAt]
    FraudEvent:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        reason: { type: string }
        riskScore: { type: integer }
        createdAt: { type: string, format: date-time }
      required: [id, userId, reason, riskScore, createdAt]
    AuditLog:
      type: object
      properties:
        id: { type: string }
        actor: { type: string }
        action: { type: string }
        sourceId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
      required: [id, actor, action, sourceId, createdAt]
    RevenueEvent:
      type: object
      properties:
        id: { type: string }
        sourceId: { type: string }
        grossRevenueNok: { type: number }
        providerCostNok: { type: number }
        rewardCostNok: { type: number }
        contributionNok: { type: number }
        createdAt: { type: string, format: date-time }
      required: [id, sourceId, grossRevenueNok, providerCostNok, rewardCostNok, contributionNok, createdAt]

