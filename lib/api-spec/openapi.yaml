openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API for the BONUSPLAY demo rewards platform
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bonusplay
    description: BONUSPLAY demo account, game and rewards operations
paths:
  /v2/offers:
    get:
      operationId: listV2Offers
      tags: [v2]
      responses:
        "200":
          description: Approved offers and rollout gate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2OfferPage" }
        default: { $ref: "#/components/responses/V2PointsError" }
  /v2/offers/{offerId}:
    get:
      operationId: getV2Offer
      tags: [v2]
      parameters:
        - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Approved offer details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2OfferDetail" }
        default: { $ref: "#/components/responses/V2PointsError" }
  /v2/offers/{offerId}/start:
    post:
      operationId: startV2Offer
      tags: [v2]
      parameters:
        - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V2OfferStartInput" }
      responses:
        "200":
          description: Persisted attributed click; no points awarded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2OfferStart" }
        default: { $ref: "#/components/responses/V2PointsError" }
  /v2/conversions:
    get:
      operationId: listV2Conversions
      tags: [v2]
      responses:
        "200":
          description: Own latest 100 conversions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2ConversionPage" }
        default: { $ref: "#/components/responses/V2PointsError" }
  /v2/admin/offer-partners:
    get:
      operationId: listV2OfferPartners
      tags: [v2]
      responses:
        "200":
          description: Operator-configured partner identifiers; no credentials
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/V2OfferPartner" }
        default: { $ref: "#/components/responses/V2PointsError" }
  /v2/admin/offers:
    get:
      operationId: listV2AdminOffers
      tags: [v2]
      responses:
        "200":
          description: Latest 100 offers including drafts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2OfferPage" }
        default: { $ref: "#/components/responses/V2PointsError" }
    post:
      operationId: createV2Offer
      tags: [v2]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V2OfferInput" }
      responses:
        "201":
          description: Immutable draft, awaiting review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Offer" }
        default: { $ref: "#/components/responses/V2PointsError" }
  /v2/admin/offers/{offerId}/review:
    post:
      operationId: reviewV2Offer
      tags: [v2]
      parameters:
        - { name: offerId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V2OfferReviewInput" }
      responses:
        "200":
          description: Reviewed offer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Offer" }
        default: { $ref: "#/components/responses/V2PointsError" }
  /v2/admin/conversions:
    get:
      operationId: listV2AdminConversions
      tags: [v2]
      responses:
        "200":
          description: Latest 100 conversions for administrator review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2ConversionPage" }
        default: { $ref: "#/components/responses/V2PointsError" }
  /v2/admin/conversions/{conversionId}/review:
    post:
      operationId: reviewV2Conversion
      tags: [v2]
      parameters:
        - { name: conversionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V2ConversionReviewInput" }
      responses:
        "200":
          description: Atomic conversion and ledger decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Conversion" }
        default: { $ref: "#/components/responses/V2PointsError" }
  /v2/admin/conversions/{conversionId}/reverse:
    post:
      operationId: reverseV2Conversion
      tags: [v2]
      summary: Administrator-only full reversal; preserves terminal partner evidence
      parameters:
        - { name: conversionId, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V2ConversionReversalInput" }
      responses:
        "200":
          description: Atomic compensation and immutable reversed lifecycle event; replay returns current state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2ConversionReversalResult" }
        default: { $ref: "#/components/responses/V2PointsError" }
  /v2/offer-callbacks/{partnerId}:
    post:
      operationId: receiveV2OfferCallback
      tags: [v2]
      summary: Signed server callback, not cookie authenticated
      description: HMAC-SHA256 hex over timestamp.nonce.rawBody. Five-minute window; each nonce accepted once. No browser amount or account identifier accepted.
      parameters:
        - { name: partnerId, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9-]{3,40}$" } }
        - { name: X-BP-Timestamp, in: header, required: true, schema: { type: string } }
        - { name: X-BP-Nonce, in: header, required: true, schema: { type: string, format: uuid } }
        - { name: X-BP-Signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V2OfferCallbackInput" }
      responses:
        "200":
          description: Evidence stored; verified evidence still requires administrator approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Conversion" }
        default: { $ref: "#/components/responses/V2PointsError" }
  /v2/wallet:
    get:
      operationId: getV2Wallet
      tags: [v2]
      summary: Read own real ledger balance, never demo balances
      responses:
        "200":
          description: Points wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Wallet" }
        default:
          $ref: "#/components/responses/V2PointsError"
  /v2/transactions:
    get:
      operationId: listV2Transactions
      tags: [v2]
      parameters:
        - $ref: "#/components/parameters/PointsCursor"
        - $ref: "#/components/parameters/PointsLimit"
      responses:
        "200":
          description: Newest first keyset-paginated history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2TransactionPage" }
        default:
          $ref: "#/components/responses/V2PointsError"
  /v2/admin/accounts/{accountId}/wallet:
    get:
      operationId: getV2AdminWallet
      tags: [v2]
      parameters:
        - $ref: "#/components/parameters/PointsAccountId"
      responses:
        "200":
          description: Administrator account wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Wallet" }
        default:
          $ref: "#/components/responses/V2PointsError"
  /v2/admin/accounts/{accountId}/transactions:
    get:
      operationId: listV2AdminTransactions
      tags: [v2]
      parameters:
        - $ref: "#/components/parameters/PointsAccountId"
        - $ref: "#/components/parameters/PointsCursor"
        - $ref: "#/components/parameters/PointsLimit"
      responses:
        "200":
          description: Administrator account history
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2TransactionPage" }
        default:
          $ref: "#/components/responses/V2PointsError"
  /v2/admin/accounts/{accountId}/adjustments:
    post:
      operationId: adjustV2Points
      tags: [v2]
      summary: Audited administrator adjustment with mandatory reason
      parameters:
        - $ref: "#/components/parameters/PointsAccountId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V2PointsAdjustment" }
      responses:
        "200":
          description: Committed transaction or identical idempotent replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2PointsResult" }
        default:
          $ref: "#/components/responses/V2PointsError"
  /v2/admin/transactions/{transactionId}/decision:
    post:
      operationId: decideV2Points
      tags: [v2]
      summary: Approve or reject a pending transaction, append-only
      parameters:
        - $ref: "#/components/parameters/PointsTransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V2PointsDecision" }
      responses:
        "200":
          description: Committed decision or identical replay
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2PointsResult" }
        default:
          $ref: "#/components/responses/V2PointsError"
  /v2/admin/transactions/{transactionId}/compensation:
    post:
      operationId: compensateV2Points
      tags: [v2]
      summary: Full refund of a debit or full reversal of a credit/debit
      parameters:
        - $ref: "#/components/parameters/PointsTransactionId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V2PointsCompensation" }
      responses:
        "200":
          description: Committed compensation or identical replay; amount derived from original
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2PointsResult" }
        default:
          $ref: "#/components/responses/V2PointsError"
  /v2/me:
    get:
      operationId: getV2Account
      tags: [v2]
      summary: Get the authenticated V2 profile, or null before enrollment
      responses:
        "200":
          description: Account state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2AccountState" }
        "401":
          description: Login required
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    patch:
      operationId: updateV2Account
      tags: [v2]
      summary: Update the current account profile, never roles or balances
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V2ProfileInput" }
      responses:
        "200":
          description: Updated account state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2AccountState" }
  /v2/enroll:
    post:
      operationId: enrollV2Account
      tags: [v2]
      summary: Enroll a verified identity with versioned legal acceptance
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/V2EnrollmentInput" }
      responses:
        "201":
          description: Account enrolled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2AccountState" }
  /v2/admin/access:
    get:
      operationId: checkV2AdminAccess
      tags: [v2]
      summary: Server-side administrator authorization probe
      responses:
        "200":
          description: Access permitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Access" }
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /v2/partner/access:
    get:
      operationId: checkV2PartnerAccess
      tags: [v2]
      summary: Server-side partner authorization probe
      responses:
        "200":
          description: Access permitted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V2Access" }
        "403":
          description: Insufficient permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bonusplay/demo-session:
    post:
      operationId: startDemoSession
      tags: [bonusplay]
      summary: Start a signed demo user or admin session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoSessionInput"
      responses:
        "200":
          description: Demo session started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoSession"
        "400":
          description: Invalid demo role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/logout:
    post:
      operationId: endDemoSession
      tags: [bonusplay]
      summary: End the current demo session
      responses:
        "200":
          description: Session ended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
  /bonusplay/state:
    get:
      operationId: getBonusplayState
      tags: [bonusplay]
      summary: Get the current user's full app state
      responses:
        "200":
          description: Current app state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonusplayState"
        "401":
          description: Demo session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/claims:
    post:
      operationId: claimActivity
      tags: [bonusplay]
      summary: Claim a server-approved demo activity reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimActivityInput"
      responses:
        "200":
          description: Activity reward accepted or already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResult"
        "400":
          description: Invalid activity or session identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Demo session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Activity already claimed or daily limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/daily-reward:
    post:
      operationId: claimDailyReward
      tags: [bonusplay]
      summary: Claim today's streak reward
      responses:
        "200":
          description: Daily reward claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResult"
        "401":
          description: Demo session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Today's reward was already claimed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/redemptions:
    post:
      operationId: createRedemption
      tags: [bonusplay]
      summary: Order a demo reward using points
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedemptionInput"
      responses:
        "201":
          description: Demo reward order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimResult"
        "400":
          description: Invalid reward
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Demo session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Insufficient balance or duplicate request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/reset:
    post:
      operationId: resetDemo
      tags: [bonusplay]
      summary: Restore the original demo account state
      responses:
        "200":
          description: Demo account restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonusplayState"
        "401":
          description: Demo session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/features/{key}:
    patch:
      operationId: updateFeatureFlag
      tags: [bonusplay]
      summary: Enable or disable a demo feature (admin only)
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum: [ADS, SURVEYS, OFFERS, GAMES, EVENTS, LEADERBOARDS, REFERRALS, REDEMPTIONS, CHESTS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureFlagInput"
      responses:
        "200":
          description: Feature flag updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeatureFlag"
        "401":
          description: Demo admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/missions/{id}:
    patch:
      operationId: updateMission
      tags: [bonusplay]
      summary: Edit a demo mission (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionUpdate"
      responses:
        "200":
          description: Mission updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Mission"
        "401":
          description: Demo admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Mission not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/admin:
    get:
      operationId: getAdminDashboard
      tags: [bonusplay]
      summary: Get demo admin metrics (admin only)
      responses:
        "200":
          description: Admin dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "401":
          description: Demo admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/admin/catalog:
    get:
      operationId: getAdminCatalog
      tags: [bonusplay]
      summary: List all editable demo catalog items
      responses:
        "200":
          description: Catalog items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogItem"
        "401":
          description: Admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCatalogItem
      tags: [bonusplay]
      summary: Create a mission, survey, offer, event or reward
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogInput"
      responses:
        "201":
          description: Catalog item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItem"
        "400":
          description: Invalid catalog item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/admin/catalog/{id}:
    patch:
      operationId: updateCatalogItem
      tags: [bonusplay]
      summary: Edit or disable a demo catalog item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogUpdate"
      responses:
        "200":
          description: Catalog item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogItem"
        "400":
          description: Invalid catalog item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin session required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Catalog item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /bonusplay/notifications/read:
    post:
      operationId: markNotificationsRead
      tags: [bonusplay]
      summary: Persist notification read status
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationReadInput"
      responses:
        "200":
          description: Notifications updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BonusplayState"
  /bonusplay/analytics:
    post:
      operationId: recordAnalyticsEvent
      tags: [bonusplay]
      summary: Record a permitted demo analytics event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalyticsInput"
      responses:
        "200":
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"
components:
  responses:
    V2PointsError:
      description: 400 invalid input; 401 login required; 403 forbidden; 404 not found; 409 replay conflict, insufficient balance or invalid transition; 429 rate limit
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
  parameters:
    PointsAccountId:
      name: accountId
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
    PointsTransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PointsCursor:
      name: cursor
      in: query
      schema: { type: string, pattern: '^[1-9][0-9]{0,18}$' }
    PointsLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
  schemas:
    V2OfferPartner:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
    V2OfferInput:
      type: object
      additionalProperties: false
      required: [partnerId, title, description, terms, points, destinationUrl, category, requirements, completionSteps, estimatedMinutes, approvalDays]
      properties:
        partnerId: { type: string, pattern: "^[a-z0-9-]{3,40}$" }
        title: { type: string, minLength: 3, maxLength: 120 }
        description: { type: string, minLength: 10, maxLength: 2000 }
        terms: { type: string, minLength: 10, maxLength: 4000 }
        points: { type: integer, minimum: 1, maximum: 1000000 }
        destinationUrl: { type: string, format: uri, maxLength: 2000 }
        category: { type: string, enum: [shopping, subscriptions, surveys, apps, services, finance, travel, food, entertainment, other] }
        requirements: { type: string, minLength: 10, maxLength: 2000 }
        completionSteps: { type: string, minLength: 10, maxLength: 2000 }
        estimatedMinutes: { type: integer, minimum: 1, maximum: 10080 }
        approvalDays: { type: integer, minimum: 1, maximum: 365 }
        expiresAt: { type: [string, "null"], format: date-time }
    V2Offer:
      type: object
      required: [id, partnerId, partnerName, partnerLogoUrl, title, description, terms, points, status, createdAt, destinationUrl, category, requirements, completionSteps, estimatedMinutes, approvalDays, expiresAt]
      properties:
        id: { type: string, format: uuid }
        partnerId: { type: string }
        partnerName: { type: string }
        title: { type: string }
        description: { type: string }
        terms: { type: string }
        points: { type: integer }
        status: { type: string, enum: [draft, approved, rejected] }
        createdAt: { type: string, format: date-time }
        destinationUrl: { type: string, format: uri }
